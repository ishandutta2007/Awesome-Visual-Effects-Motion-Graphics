<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -120; }
    }
    @keyframes nodeFloat1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes nodeFloat2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-2deg); }
    }
    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes particleFlow {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .ambient-sphere {
      transform-origin: center;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashTravel 4s linear infinite;
    }
    .floating-group-1 {
      animation: nodeFloat1 6s ease-in-out infinite;
    }
    .floating-group-2 {
      animation: nodeFloat2 7s ease-in-out infinite;
    }
    .rotating-ring {
      transform-origin: 1050px 180px;
      animation: ringRotate 24s linear infinite;
    }
    .rotating-ring-left {
      transform-origin: 150px 200px;
      animation: ringRotate 30s linear reverse infinite;
    }
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .banner-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Grid Overlay -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <pattern id="vfxGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="380" fill="url(#vfxGrid)" />
  </g>

  <!-- Ambient Glow Spheres (Background) -->
  <circle cx="180" cy="190" r="150" fill="url(#glowViolet)" class="ambient-sphere" filter="url(#glowFilter)" />
  <circle cx="1020" cy="180" r="170" fill="url(#glowCyan)" class="ambient-sphere" style="animation-delay: -3s;" filter="url(#glowFilter)" />
  <circle cx="600" cy="20" r="120" fill="url(#glowViolet)" opacity="0.25" filter="url(#glowFilter)" />

  <!-- Geometric Decorative Rotating Rings (Background Sides) -->
  <g class="rotating-ring-left" opacity="0.25">
    <circle cx="150" cy="200" r="90" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="12 18" />
    <circle cx="150" cy="200" r="60" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="6 12" />
  </g>
  <g class="rotating-ring" opacity="0.25">
    <circle cx="1050" cy="180" r="110" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="16 20" />
    <circle cx="1050" cy="180" r="75" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8 14" />
  </g>

  <!-- Node-Graph Connections (Compositing Pipeline Lines) -->
  <g opacity="0.55">
    <path d="M 160 120 C 260 120, 280 200, 380 200" fill="none" stroke="#8b5cf6" stroke-width="2.5" class="flow-line" />
    <path d="M 160 260 C 260 260, 280 200, 380 200" fill="none" stroke="#ec4899" stroke-width="2.5" class="flow-line" />
    <path d="M 820 200 C 920 200, 940 130, 1040 130" fill="none" stroke="#06b6d4" stroke-width="2.5" class="flow-line" />
    <path d="M 820 200 C 920 200, 940 270, 1040 270" fill="none" stroke="#3b82f6" stroke-width="2.5" class="flow-line" />
  </g>

  <!-- Animated Node Graph Elements (Left VFX Side) -->
  <g class="floating-group-1">
    <!-- Read / Source Node -->
    <g transform="translate(90, 95)" filter="url(#shadowFilter)">
      <rect width="110" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#a5b4fc" />
      <text x="32" y="25" fill="#e0e7ff" font-size="12" font-family="sans-serif" font-weight="600">Plate_EXR</text>
    </g>
    <!-- Keyer / Matte Node -->
    <g transform="translate(90, 235)" filter="url(#shadowFilter)">
      <rect width="110" height="42" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#e879f9" />
      <text x="32" y="25" fill="#f5d0fe" font-size="12" font-family="sans-serif" font-weight="600">Roto_Key</text>
    </g>
  </g>

  <!-- Animated Node Graph Elements (Right Motion Side) -->
  <g class="floating-group-2">
    <!-- 3D Camera Tracker Node -->
    <g transform="translate(1000, 105)" filter="url(#shadowFilter)">
      <rect width="120" height="42" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#38bdf8" />
      <text x="32" y="25" fill="#e0f2fe" font-size="12" font-family="sans-serif" font-weight="600">Camera3D</text>
    </g>
    <!-- Render / Output Node -->
    <g transform="translate(1000, 245)" filter="url(#shadowFilter)">
      <rect width="120" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="18" cy="21" r="5" fill="#34d399" />
      <text x="32" y="25" fill="#d1fae5" font-size="12" font-family="sans-serif" font-weight="600">Composite</text>
    </g>
  </g>

  <!-- Center Main Title Box (Ensures complete foreground visibility and crisp readability) -->
  <g filter="url(#shadowFilter)">
    <!-- Backplate for ultra-crisp text legibility -->
    <rect x="230" y="55" width="740" height="270" rx="18" fill="#030712" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.2" />

    <!-- Top Category Ribbon -->
    <g transform="translate(450, 80)">
      <rect x="0" y="0" width="300" height="26" rx="13" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#a78bfa" />
      <text x="150" y="17" text-anchor="middle" fill="#c7d2fe" class="badge-text">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="162" text-anchor="middle" fill="url(#textGrad)" class="banner-title" font-size="40">Awesome Visual Effects</text>
    <text x="600" y="210" text-anchor="middle" fill="url(#textGrad)" class="banner-title" font-size="36">&amp; Motion Graphics</text>

    <!-- Subtitle -->
    <text x="600" y="252" text-anchor="middle" fill="#94a3b8" class="banner-sub" font-size="13">NODE-BASED COMPOSITING • PROCEDURAL DESIGN • PIPELINES</text>

    <!-- Feature Tech Pills -->
    <g transform="translate(325, 276)">
      <!-- Pill 1: VFX & Nodes -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="13" fill="#18181b" stroke="#3b82f6" stroke-width="1" />
        <text x="52" y="17" text-anchor="middle" fill="#93c5fd" class="badge-text">⚡ NODE VFX</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(120, 0)">
        <rect width="125" height="26" rx="13" fill="#18181b" stroke="#8b5cf6" stroke-width="1" />
        <text x="62" y="17" text-anchor="middle" fill="#c4b5fd" class="badge-text">🔓 OPEN SOURCE</text>
      </g>
      <!-- Pill 3: Motion Design -->
      <g transform="translate(260, 0)">
        <rect width="135" height="26" rx="13" fill="#18181b" stroke="#ec4899" stroke-width="1" />
        <text x="67" y="17" text-anchor="middle" fill="#f472b6" class="badge-text">🎨 MOTION DESIGN</text>
      </g>
      <!-- Pill 4: SaaS Tools -->
      <g transform="translate(410, 0)">
        <rect width="135" height="26" rx="13" fill="#18181b" stroke="#10b981" stroke-width="1" />
        <text x="67" y="17" text-anchor="middle" fill="#6ee7b7" class="badge-text">🚀 STUDIO STACK</text>
      </g>
    </g>
  </g>
</svg>